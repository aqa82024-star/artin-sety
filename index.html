<body>

<div id="app"></div>

<script type="module">
async function loadThree(){
  const urls=[
    './three.module.min.js',
    'https://unpkg.com/three@0.160.0/build/three.module.min.js',
    'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js',
    'https://fastly.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js',
    'https://gcore.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js',
    'https://esm.sh/three@0.160.0',
    'https://cdn.skypack.dev/three@0.160.0'
  ];
  for(const u of urls){
    try{
      return await Promise.race([import(u), new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),9000))]);
    }catch(e){ console.warn('three load failed:',u,e); }
  }
  return null;
}
const THREE = await loadThree();
if(!THREE){
  const d=document.createElement('div');
  d.style.cssText='position:fixed;left:0;right:0;bottom:6vh;text-align:center;color:#ffb3c6;font:14px Tahoma,sans-serif;direction:rtl;padding:0 20px';
  d.textContent='Three.js load failed - check internet / VPN';
  document.body.appendChild(d);
  throw new Error('three.js could not be loaded');
}

const isMobile = matchMedia('(max-width: 820px)').matches || /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);

/* ---------- random (ثابت و تکرارپذیر) ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd = mulberry32(20261107);
const R = (a,b)=>a+(b-a)*rnd();
const clamp = (x,a,b)=>Math.min(b,Math.max(a,x));
const easeOutBack = x => { const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2); };

/* ---------- renderer / scene ---------- */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:!isMobile, alpha:true, powerPreference:'high-performance' });
let dpr = Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 1.75);
renderer.setPixelRatio(dpr);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
function makeEnvScene(){
  const e=new THREE.Scene();
  e.add(new THREE.Mesh(new THREE.SphereGeometry(10,32,16), new THREE.MeshBasicMaterial({color:0x6a5560, side:THREE.BackSide})));
  const box=(w,h,x,y,z,k,col)=>{ const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshBasicMaterial({color:new THREE.Color(col).multiplyScalar(k), side:THREE.DoubleSide})); m.position.set(x,y,z); m.lookAt(0,0,0); e.add(m); };
  box(6,4,0,8,0,6,0xfff2e6); box(4,6,-8,2,5,4,0xffc0d0); box(4,4,8,3,-4,3,0xffffff); box(8,2,0,-6,0,0.8,0xffb0c0);
  return e;
}
scene.environment = pmrem.fromScene(makeEnvScene(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(32, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0.5, 18);

function makeControls(camera, el){
  const c={target:new THREE.Vector3(0,-0.75,0),theta:0,phi:1.37,radius:18,minDistance:5,maxDistance:30,autoRotate:true,autoRotateSpeed:1.2};
  const ptr=new Map(); let vT=0,vP=0,lastD=0;
  el.style.touchAction='none';
  const dist2=()=>{const a=[...ptr.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);};
  el.addEventListener('pointerdown',e=>{ try{el.setPointerCapture(e.pointerId);}catch(_){}
    ptr.set(e.pointerId,{x:e.clientX,y:e.clientY}); vT=vP=0; if(ptr.size===2) lastD=dist2(); });
  el.addEventListener('pointermove',e=>{
    const p=ptr.get(e.pointerId); if(!p) return;
    const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
    if(ptr.size===1){
      vT=-dx*0.006; vP=-dy*0.005;
      c.theta+=vT; c.phi=clamp(c.phi+vP,0.55,1.75);
    } else if(ptr.size===2){
      const d=dist2(); if(lastD>0) c.radius=clamp(c.radius*lastD/d,c.minDistance,c.maxDistance); lastD=d;
    }
  });
  const up=e=>{ ptr.delete(e.pointerId); lastD=0; };
  el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
  el.addEventListener('wheel',e=>{ e.preventDefault(); c.radius=clamp(c.radius*(1+e.deltaY*0.0012),c.minDistance,c.maxDistance); },{passive:false});
  c.update=function(dt){
    if(ptr.size===0){
      c.theta+=vT; c.phi=clamp(c.phi+vP,0.55,1.75); vT*=0.93; vP*=0.93;
      if(c.autoRotate) c.theta+=c.autoRotateSpeed*dt*0.12;
    }
    camera.position.set(
      c.target.x+c.radius*Math.sin(c.phi)*Math.sin(c.theta),
      c.target.y+c.radius*Math.cos(c.phi),
      c.target.z+c.radius*Math.sin(c.phi)*Math.cos(c.theta));
    camera.lookAt(c.target);
  };
  return c;
}
const controls = makeControls(camera, renderer.domElement);

/* ---------- lights ---------- */
const key = new THREE.DirectionalLight(0xfff1e0, 2.3); key.position.set(4, 7, 6); scene.add(key);
const fill = new THREE.DirectionalLight(0xff9ab4, 0.9); fill.position.set(-6, 2, 4); scene.add(fill);
const rim = new THREE.DirectionalLight(0xff6f9a, 1.8); rim.position.set(-2, 4, -7); scene.add(rim);
scene.add(new THREE.HemisphereLight(0xffd8e0, 0x2a0610, 0.55));

/* ---------- textures ---------- */
function makeVeinTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#808080'; g.fillRect(0,0,256,256);
  for(let i=0;i<170;i++){
    const v = rnd()<.5 ? 255 : 0;
    g.strokeStyle = `rgba(${v},${v},${v},${0.08+rnd()*0.12})`;
    g.lineWidth = 0.5 + rnd()*1.6;
    g.beginPath();
    g.moveTo(128 + (rnd()-.5)*40, 256);
    g.quadraticCurveTo(rnd()*256, 130, rnd()*256, 10 + rnd()*30);
    g.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  return tex;
}
const veinTex = makeVeinTexture();

function makeGlowTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.25,'rgba(255,220,190,.8)');
  gr.addColorStop(1,'rgba(255,120,160,0)');
  g.fillStyle = gr; g.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
}

/* ---------- materials ---------- */
const petalMat = new THREE.MeshStandardMaterial({
  vertexColors:true, roughness:0.55, metalness:0, side:THREE.DoubleSide, envMapIntensity:0.6
});
const leafMat = new THREE.MeshStandardMaterial({
  vertexColors:true, roughness:0.5, metalness:0, side:THREE.DoubleSide, envMapIntensity:0.5
});

/* ---------- گلبرگ و رز ---------- */
const palettes = [
  {d:0x2b0007,m:0x9c0b1e,t:0xd81f3a},
  {d:0x1f0005,m:0x80081a,t:0xb8152f},
  {d:0x35000a,m:0xb80f28,t:0xf03550},
  {d:0x2b0007,m:0xa30c22,t:0xe0263f}
].map(p=>({d:new THREE.Color(p.d),m:new THREE.Color(p.m),t:new THREE.Color(p.t)}));

const _c = new THREE.Color();
function shade(pal,t,av,ri,jit,v,seed){
  if(t<.45) _c.copy(pal.d).lerp(pal.m,t/.45); else _c.copy(pal.m).lerp(pal.t,(t-.45)/.55);
  _c.lerp(pal.t, Math.pow(av,3)*t*0.35);
  const m = (0.5+0.5*ri/6)*jit*(1+0.06*Math.sin(v*14+seed));
  _c.multiplyScalar(m);
  return _c;
}

function makeProfile(r0,y0,th0,k,cu,L,steps=24){
  const pr=[r0], py=[y0]; let r=r0,y=y0; const dl=L/steps;
  for(let i=0;i<steps;i++){
    const t=(i+.5)/steps; const th=th0+k*t+cu*t*t*t;
    r+=Math.sin(th)*dl; y+=Math.cos(th)*dl; pr.push(r); py.push(y);
  }
  return {pr,py,steps};
}
function sampleProfile(p,t){
  const f=clamp(t,0,1)*p.steps; const i=Math.min(Math.floor(f),p.steps-1); const a=f-i;
  return [p.pr[i]+(p.pr[i+1]-p.pr[i])*a, p.py[i]+(p.py[i+1]-p.py[i])*a];
}

const NU = isMobile ? 8 : 10;
const NV = isMobile ? 6 : 7;

const RINGS = [
  {n:3,r0:.07,y0:.16, th0:.04,k:-.05,cu:0,   L:.52,hw:.20,edge:0},
  {n:3,r0:.15,y0:.10, th0:.12,k:-.18,cu:0,   L:.66,hw:.27,edge:0},
  {n:4,r0:.22,y0:.05, th0:.20,k:.02, cu:.05, L:.80,hw:.34,edge:.1},
  {n:5,r0:.29,y0:0,   th0:.36,k:.22, cu:.18, L:.88,hw:.40,edge:.4},
  {n:5,r0:.34,y0:-.04,th0:.58,k:.34, cu:.35, L:.92,hw:.48,edge:.7},
  {n:6,r0:.40,y0:-.08,th0:.82,k:.38, cu:.55, L:.92,hw:.54,edge:1,  minO:.62},
  {n:6,r0:.45,y0:-.12,th0:1.02,k:.28,cu:.75, L:.88,hw:.56,edge:1.2,minO:.78}
];

function makeRoseGeometry(o, pal){
  const P=[],C=[],U=[],I=[];
  let off = rnd()*6.28;
  RINGS.forEach((rg,ri)=>{
    if(rg.minO && o<rg.minO) return;
    off += 2.39996;
    const f = ri>=3 ? 0.75+0.25*o : 1;
    for(let j=0;j<rg.n;j++){
      const phi = off + j*2*Math.PI/rg.n + R(-.15,.15);
      const sc = R(.92,1.08);
      const seed = rnd()*10;
      const jit = R(.92,1.08);
      const prof = makeProfile(rg.r0*R(.95,1.05), rg.y0, rg.th0*f+R(-.06,.06), rg.k*f, rg.cu*f, rg.L*sc);
      const base = P.length/3;
      for(let a=0;a<=NU;a++){
        const t=a/NU;
        const wp=Math.pow(Math.sin(Math.PI*(0.12+0.78*t)),0.7);
        for(let b=0;b<=NV;b++){
          const v=b/NV*2-1;
          const te=t*(1-0.16*v*v);
          let [r,y]=sampleProfile(prof,te);
          if(t>0.62){
            const s=(t-.62)/.38, s2=s*s;
            r += s2*(0.045*Math.sin(v*5+seed)+0.08*v*v*rg.edge);
            y += s2*0.05*Math.sin(v*7+seed*2.1);
          }
          const hw=rg.hw*sc*wp;
          const ang=phi+v*Math.min(1.5,hw/Math.max(r,0.1));
          P.push(r*Math.sin(ang), y, r*Math.cos(ang));
          const col=shade(pal,t,Math.abs(v),ri,jit,v,seed);
          C.push(col.r,col.g,col.b);
          U.push(b/NV,t);
        }
      }
      for(let a=0;a<NU;a++) for(let b=0;b<NV;b++){
        const i0=base+a*(NV+1)+b, i1=i0+1, i2=i0+NV+1, i3=i2+1;
        I.push(i0,i2,i1, i1,i2,i3);
      }
    }
  });
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(C,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(U,2));
  g.setIndex(I);
  g.computeVertexNormals();
  return g;
}

/* ---------- برگ ---------- */
const darkG = new THREE.Color(0x0f3a1a), lightG = new THREE.Color(0x3f8f45);
function makeLeaf(L,W,e0,g,serr=0.05,nu=14,nv=6){
  const P=[],C=[],I=[];
  const cx=[0],cy=[0],ce=[e0]; let x=0,y=0; const dl=L/nu;
  for(let i=0;i<nu;i++){ const u=(i+.5)/nu; const e=e0-g*u*u; x+=Math.cos(e)*dl; y+=Math.sin(e)*dl; cx.push(x);cy.push(y);ce.push(e0-g*((i+1)/nu)*((i+1)/nu)); }
  const col=new THREE.Color();
  for(let a=0;a<=nu;a++){
    const u=a/nu, e=ce[a], nx=-Math.sin(e), ny=Math.cos(e);
    const w=W*Math.pow(Math.sin(Math.PI*Math.pow(u,.75)),.85)*(1+serr*Math.sin(u*70));
    for(let b=0;b<=nv;b++){
      const v=b/nv*2-1;
      const fold=0.35*Math.abs(v)*w;
      P.push(cx[a]+nx*fold, cy[a]+ny*fold, v*w);
      col.copy(darkG).lerp(lightG, clamp(Math.abs(v)*.7+u*.2,0,1)).multiplyScalar(1+0.08*Math.sin(u*45+Math.abs(v)*8));
      C.push(col.r,col.g,col.b);
    }
  }
  for(let a=0;a<nu;a++) for(let b=0;b<nv;b++){
    const i0=a*(nv+1)+b,i1=i0+1,i2=i0+nv+1,i3=i2+1; I.push(i0,i2,i1,i1,i2,i3);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  geo.setAttribute('color',new THREE.Float32BufferAttribute(C,3));
  geo.setIndex(I); geo.computeVertexNormals();
  return geo;
}

function mergeGeometries(list){
  let nv=0,ni=0; for(const g of list){ nv+=g.attributes.position.count; ni+=g.index.count; }
  const P=new Float32Array(nv*3),N=new Float32Array(nv*3),C=new Float32Array(nv*3),I=new Uint32Array(ni);
  let ov=0,oi=0;
  for(const g of list){
    const n=g.attributes.position.count;
    P.set(g.attributes.position.array,ov*3); N.set(g.attributes.normal.array,ov*3); C.set(g.attributes.color.array,ov*3);
    const idx=g.index.array; for(let i=0;i<idx.length;i++) I[oi+i]=idx[i]+ov;
    ov+=n; oi+=idx.length;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(P,3)); g.setAttribute('normal',new THREE.BufferAttribute(N,3)); g.setAttribute('color',new THREE.BufferAttribute(C,3));
  g.setIndex(new THREE.BufferAttribute(I,1)); return g;
}

/* ---------- کاسبرگ ---------- */
const calyxGeo = (()=>{
  const pts=[[0.001,-0.5],[0.05,-0.42],[0.09,-0.3],[0.17,-0.14],[0.26,-0.02],[0.28,0.04],[0.2,0.06],[0.001,0.05]]
    .map(p=>new THREE.Vector2(p[0],p[1]));
  const g=new THREE.LatheGeometry(pts,18);
  const n=g.attributes.position.count, c=new Float32Array(n*3);
  for(let i=0;i<n;i++){ c[i*3]=0.1; c[i*3+1]=0.32; c[i*3+2]=0.14; }
  g.setAttribute('color',new THREE.BufferAttribute(c,3));
  return g;
})();
const sepalGeo = makeLeaf(0.5,0.1,0.2,1.8,0.02,8,4);
calyxGeo.deleteAttribute('uv');
const calyxFull = (()=>{
  const parts=[calyxGeo];
  for(let k=0;k<5;k++) parts.push(sepalGeo.clone().rotateY(k/5*Math.PI*2+0.1*Math.sin(k*5)).translate(0,-0.06,0));
  return mergeGeometries(parts);
})();

/* ---------- بوکه ---------- */
const bouquet = new THREE.Group(); scene.add(bouquet);
const DOME = { cy:-1.3, R:2.1, cap:THREE.MathUtils.degToRad(72) };
const UP = new THREE.Vector3(0,1,0);
function domeDir(alpha,beta){ return new THREE.Vector3(Math.sin(alpha)*Math.cos(beta), Math.cos(alpha), Math.sin(alpha)*Math.sin(beta)); }

// پر کننده‌ی سبز داخل (برای اینکه بین رزها خالی نباشد)
{
  const geo = new THREE.SphereGeometry(1.9,48,24,0,Math.PI*2,0,THREE.MathUtils.degToRad(82));
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color:0x0e2a14, roughness:.85, side:THREE.DoubleSide}));
  m.position.y = DOME.cy; bouquet.add(m);
}

// رزها
const roses = [];
const N = isMobile ? 22 : 28;
for(let i=0;i<N;i++){
  const f=(i+.5)/N;
  let alpha=Math.acos(1-f*(1-Math.cos(DOME.cap)))*(1+R(-.03,.03));
  const beta=i*2.39996323;
  const dir=domeDir(alpha,beta);
  const rr=DOME.R+R(-.06,.14);
  const pos=dir.clone().multiplyScalar(rr); pos.y+=DOME.cy;
  const o = R(.55,1);
  const pal = palettes[Math.floor(rnd()*palettes.length)];
  const s = R(.38,.47)*(1-0.12*f);
  const g = new THREE.Group();
  const head = new THREE.Mesh(makeRoseGeometry(o,pal), petalMat);
  head.rotation.y = rnd()*6.28;
  g.add(head);
  const cal = new THREE.Mesh(calyxFull, leafMat); cal.position.y=-0.02; g.add(cal);
  const n2=dir.clone().add(new THREE.Vector3(R(-.12,.12),R(-.08,.08),R(-.12,.12))).normalize();
  g.position.copy(pos);
  g.quaternion.setFromUnitVectors(UP,n2);
  g.scale.setScalar(0.0001);
  bouquet.add(g);
  roses.push({g,s,delay:0.35+f*1.1+R(0,.15)});
}

// برگ‌ها
const leaves = [];
function addLeaf(alphaDeg,beta,L,W,e0,g,delay){
  const alpha=THREE.MathUtils.degToRad(alphaDeg);
  const base=domeDir(alpha,beta).multiplyScalar(DOME.R-0.1); base.y+=DOME.cy;
  const grp=new THREE.Group(); grp.position.copy(base); grp.rotation.y=-beta;
  const m=new THREE.Mesh(makeLeaf(L,W,e0,g),leafMat); m.rotation.x=R(-.5,.5);
  grp.add(m); grp.scale.setScalar(0.0001); bouquet.add(grp);
  leaves.push({grp,delay});
}
for(let i=0;i<18;i++) addLeaf(R(74,86), i/18*Math.PI*2+R(-.15,.15), R(1.0,1.4), R(.42,.6), R(.3,.9), R(1.0,1.8), 0.15+i*0.03);
for(let i=0;i<12;i++){
  const a=R(46,66);
  addLeaf(a, i/12*Math.PI*2+R(-.3,.3), R(.9,1.2), R(.32,.46), Math.PI/2-THREE.MathUtils.degToRad(a)+R(-.1,.25), R(.3,.8), 0.3+i*0.03);
}

// کاغذ بسته‌بندی
{
  const TOP=-0.8, H=3.6;
  const geo=new THREE.CylinderGeometry(2.2,0.28,H,120,30,true);
  geo.translate(0,TOP-H/2,0);
  const pos=geo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i), y=pos.getY(i), z=pos.getZ(i);
    const ang=Math.atan2(z,x), hh=clamp((TOP-y)/H,0,1);
    const fold=1+0.05*Math.sin(ang*9+hh*3)*(1-hh*.4)+0.025*Math.sin(ang*17-hh*5);
    const rad=Math.hypot(x,z)*fold*(1+0.08*Math.pow(1-hh,8));
    pos.setXYZ(i, rad*Math.cos(ang), y+0.1*Math.sin(ang*7)*Math.pow(1-hh,6), rad*Math.sin(ang));
  }
  geo.computeVertexNormals();
  const paper=new THREE.Mesh(geo,new THREE.MeshPhysicalMaterial({color:0xf3cdd4,roughness:.72,side:THREE.DoubleSide,sheen:.8,sheenColor:new THREE.Color(0xffffff),sheenRoughness:.6,envMapIntensity:.6}));
  bouquet.add(paper);

  // روبان
  const ribMat=new THREE.MeshPhysicalMaterial({color:0x9c0b22,roughness:.32,sheen:1,sheenColor:new THREE.Color(0xff6a88),sheenRoughness:.3,side:THREE.DoubleSide,envMapIntensity:.8});
  const band=new THREE.Mesh(new THREE.CylinderGeometry(1.31,1.31,0.24,96,1,true),ribMat);
  band.position.y=-2.7; bouquet.add(band);
  const bow=new THREE.Group(); bow.position.set(0,-2.7,1.36); bouquet.add(bow);
  [-1,1].forEach(sg=>{
    const lg=new THREE.Group(); lg.rotation.z=sg*0.55;
    const loop=new THREE.Mesh(new THREE.TorusGeometry(0.32,0.075,12,36),ribMat);
    loop.position.x=sg*0.36; loop.scale.set(1.15,1.3,0.55); lg.add(loop); bow.add(lg);
    const tail=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.8,0.03),ribMat);
    tail.position.set(sg*0.16,-0.5,0); tail.rotation.z=sg*0.22; bow.add(tail);
  });
  const knot=new THREE.Mesh(new THREE.SphereGeometry(0.14,20,16),ribMat); knot.scale.set(1,1,.8); bow.add(knot);
}

/* ---------- گلبرگ‌های در حال ریزش ---------- */
function makeLooseGeo(){
  const nu=6,nv=5,P=[],C=[],U=[],I=[]; const col=new THREE.Color();
  for(let a=0;a<=nu;a++){ const t=a/nu; const w=Math.pow(Math.sin(Math.PI*(0.12+0.78*t)),0.7)*0.55;
    for(let b=0;b<=nv;b++){ const v=b/nv*2-1; const te=t*(1-.16*v*v);
      const x=v*w, y=te*1.0, z=0.45*x*x+0.25*t*t;
      P.push(x,y,z);
      col.set(0x7a0a1c).lerp(new THREE.Color(0xd81f3a),t); C.push(col.r,col.g,col.b); U.push(b/nv,t);
    }}
  for(let a=0;a<nu;a++) for(let b=0;b<nv;b++){ const i0=a*(nv+1)+b,i1=i0+1,i2=i0+nv+1,i3=i2+1; I.push(i0,i2,i1,i1,i2,i3); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(C,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(U,2));
  g.setIndex(I); g.computeVertexNormals(); return g;
}
const looseGeo = makeLooseGeo();
const loose=[];
for(let i=0;i<(isMobile?10:18);i++){
  const m=new THREE.Mesh(looseGeo,petalMat);
  const s=R(.14,.26); m.scale.setScalar(s);
  m.position.set(R(-5,5),R(-4,7),R(-4,4));
  m.rotation.set(rnd()*6,rnd()*6,rnd()*6);
  scene.add(m);
  loose.push({m,sp:R(.25,.6),rx:R(-1.2,1.2),ry:R(-1.2,1.2),rz:R(-1.2,1.2),ph:R(0,6),dr:R(.2,.6)});
}

/* ---------- جرقه‌ها ---------- */
const SP = isMobile ? 50 : 90;
const spPos = new Float32Array(SP*3);
for(let i=0;i<SP;i++){ spPos[i*3]=R(-5,5); spPos[i*3+1]=R(-4.5,6.5); spPos[i*3+2]=R(-4,4); }
const spGeo = new THREE.BufferGeometry(); spGeo.setAttribute('position',new THREE.BufferAttribute(spPos,3));
const spMat = new THREE.PointsMaterial({size:0.12,map:makeGlowTexture(),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,opacity:.85,color:0xffc9d6});
scene.add(new THREE.Points(spGeo,spMat));

/* ---------- اندازه و دوربین ---------- */
function fit(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h);
  camera.aspect=w/h;
  camera.fov = camera.aspect<1 ? 38 : 32;
  camera.updateProjectionMatrix();
  const tanH=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const fitW=5.0, fitH=7.6;
  const dist=Math.max((fitH/2)/tanH,(fitW/2)/(tanH*camera.aspect));
  controls.radius=dist;
  controls.minDistance=dist*0.55; controls.maxDistance=dist*1.25;
}
fit();
addEventListener('resize',fit);
addEventListener('orientationchange',()=>setTimeout(fit,250));

/* ---------- انیمیشن ---------- */
const clock=new THREE.Clock();
let ready=false;
let fpsT=0, fpsN=0;
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime;
  for(const r of roses){ const k=clamp((t-r.delay)/1.3,0,1); r.g.scale.setScalar(Math.max(0.0001,r.s*easeOutBack(k))); }
  for(const l of leaves){ const k=clamp((t-l.delay)/1.1,0,1); l.grp.scale.setScalar(Math.max(0.0001,easeOutBack(k))); }
  bouquet.rotation.z=Math.sin(t*0.8)*0.012;
  bouquet.position.y=Math.sin(t*1.1)*0.03;
  for(const p of loose){
    p.m.position.y-=p.sp*dt; p.m.position.x+=Math.sin(t*0.6+p.ph)*p.dr*dt;
    p.m.rotation.x+=p.rx*dt; p.m.rotation.y+=p.ry*dt; p.m.rotation.z+=p.rz*dt;
    if(p.m.position.y<-5.5){ p.m.position.y=7; p.m.position.x=R(-5,5); p.m.position.z=R(-4,4); }
  }
  const a=spGeo.attributes.position.array;
  for(let i=0;i<SP;i++){ a[i*3+1]+=0.25*dt; a[i*3]+=Math.sin(t*0.5+i)*0.12*dt; if(a[i*3+1]>6.8) a[i*3+1]=-4.5; }
  spGeo.attributes.position.needsUpdate=true;
  spMat.opacity=0.7+0.2*Math.sin(t*2);
  controls.update(dt);
  renderer.render(scene,camera);
  if(t>2.5){ fpsT+=dt; fpsN++;
    if(fpsT>1.5){ const fps=fpsN/fpsT; fpsT=0; fpsN=0;
      if(fps<40 && dpr>1){ dpr=Math.max(1,dpr-0.25); renderer.setPixelRatio(dpr); renderer.setSize(innerWidth,innerHeight); }
    } }
  if(!ready){ ready=true; app.classList.add('ready'); }
}
tick();
</script>
